# The suite is the desk's immune system — 2,932 tests pinning risk
# invariants, gate semantics, instrument units, execution realism and
# point-in-time honesty. Tests are hermetic by construction (conftest.py
# redirects both databases to temp files and refuses the operator DB), so
# no secrets are configured here: a test that needs a real key is a test
# that is wrong.
#
# THE GATE RUNS ON THE PLATFORM THE DESK RUNS ON, AND ONLY THAT ONE.
#
# This file used to say "Windows is now a first-class job — the operator's
# deployment IS Windows". That stopped being true. The runtime moved to
# WSL2 / Ubuntu 24.04 because order_book's C extension does not build under
# MSVC without a vendored patch, and that patch no longer applies to the
# upstream sdist. Native Windows Python is not a deployment target any
# more, so gating on it would mean a permanently-red required check — and
# this same file argues, correctly, that a permanently-red check is a check
# nobody reads.
#
# ubuntu-24.04 is PINNED rather than ubuntu-latest. The desk runs 24.04
# exactly; "latest" silently becomes 26.04 one morning and the gate stops
# describing the machine it is supposed to be protecting.
#
# CPU INFERENCE IS INSTALLED; CUDA IS NOT, AND MUST NOT BE. Without
# openvino, 11 predictive-runtime tests SKIP rather than run, and what they
# cover is abstention semantics — schema mismatch, stale features, a device
# that raises. That is the "UNKNOWN stays UNKNOWN" behaviour the risk layer
# leans on, and a skip is invisible inside a green check.
#
# But JARVIS does not need CUDA at all. An import audit found torch in
# exactly one module — ml/training/train_path_model.py, an offline research
# harness nothing imports — and the model it trained was REJECTED for
# negative out-of-sample R-squared. The RTX 5090 reaches JARVIS through LM
# Studio's HTTP API, which is a network hop, not a Python dependency. A
# runner with no NVIDIA GPU has no business downloading 2 GB of CUDA
# wheels to test a trading engine.
#
# The frontend is a RELEASE GATE. This repository serves a built Svelte
# application; a green backend check while the UI fails to compile is a
# green check on half the product.
#
# The failure tail no longer goes into a public commit comment. Test
# output can carry provider responses, request context, filesystem paths
# and environment fragments, and a public repository publishes all of it
# to anyone. It is an artifact now, with only a sanitised summary surfaced.
#
# Permissions dropped to contents: read. The old file requested
# contents: write purely to post that comment — write access to the
# repository as the cost of a convenience.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# LEAST PRIVILEGE. Nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend, on the supported runtime ──────────────────────────────────
  pytest:
    name: pytest (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45         # install dominates; the suite itself is ~40s
    steps:
      # NOTE ON SUPPLY CHAIN: these are major-version tags, which are
      # mutable. Pinning to verified commit SHAs is the correct hardening
      # step and is deliberately NOT done from memory here — a wrong digest
      # breaks every build, and a guessed one is worse than an honest tag.
      # See docs: resolve the digests from the Actions repository and pin
      # them, with Dependabot configured to keep them current.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # THE REPO VENV IS PART OF THE DEPLOYMENT SHAPE, SO CI BUILDS ONE.
      #
      # This file has always claimed "one bootstrap, identical locally and
      # here". It was not identical: the desk runs out of <repo>/.venv and
      # CI installed into the hosted interpreter, so anything that reasons
      # about the venv — scripts/_common.sh identifying a JARVIS process by
      # its argv[0], start_jarvis.sh resolving an interpreter — behaved
      # differently in the one place nobody can attach a debugger. Eight
      # tests failed here and passed on the desk for exactly that reason.
      - name: Create the repository virtualenv
        run: python -m venv .venv

      # ONE FAIL-CLOSED BOOTSTRAP, IDENTICAL LOCALLY AND HERE.
      #
      # This was three bare pip lines, and on the old windows-latest job
      # that block ran under pwsh, where a failing NATIVE command does not
      # stop the script — only the LAST command's exit code decides the
      # step. So a failed `pip install -r requirements.txt` followed by a
      # successful `pip install pytest` reported SUCCESS, and pytest ran
      # against a half-installed environment. That job is gone now, but the
      # lesson is not: every step is checked and the first failure exits
      # non-zero, on every shell.
      - name: Install dependencies (fail-closed)
        run: .venv/bin/python scripts/install_dependencies.py --with-test --with-inference

      # THE GATE ASSERTS ITS OWN SHAPE. A suite that passes because a
      # dependency quietly failed to install is the exact failure this
      # section exists to prevent — 11 predictive tests once skipped inside
      # a green check for precisely that reason.
      - name: Verify the supported CPU runtime, and that CUDA is absent
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util, sys
          import openvino as ov
          devices = ov.Core().available_devices
          print(f"openvino {ov.__version__}  devices={devices}")
          if "CPU" not in devices:
              sys.exit("OpenVINO enumerates no CPU device")
          print("ok  CPU predictive baseline present")
          print("ok  NPU present" if "NPU" in devices else
                "--  NPU absent (expected on a runner; optional hardware)")
          # torch must NOT be here. Its presence would mean a normal install
          # pulled the research or CUDA set, which is the regression.
          if importlib.util.find_spec("torch") is not None:
              sys.exit("torch is installed in the normal CI environment - a "
                       "normal JARVIS install must not pull it")
          print("ok  torch absent, as the supported runtime requires")
          PY

      - name: Run suite
        env:
          JARVIS_DISABLE_SCHEDULER: "1"
          # The platform boundary must hold in CI exactly as it does on the
          # desk: no test may reach a live order path.
          JARVIS_PLATFORM_MODE: "VIRTUAL_ONLY"
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q 2>&1 | tee pytest.log

      # Forensics WITHOUT publishing raw output. The full log is an
      # artifact readable by anyone with repository access; the job summary
      # gets counts and test names only.
      - name: Sanitised failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "### pytest failed on ubuntu-24.04"
            echo ""
            echo "Failing tests:"
            echo '```'
            grep -E "^(FAILED|ERROR) " pytest.log | sed -E 's/ - .*$//' | head -40 || echo "(none parsed)"
            echo '```'
            echo ""
            grep -E "[0-9]+ (passed|failed)" pytest.log | tail -1 || true
            echo ""
            echo "Full log is attached as an artifact — it is not printed here"
            echo "because test output can contain provider responses, request"
            echo "context, filesystem paths and environment fragments."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          retention-days: 7

  # ── The frontend is part of the product ────────────────────────────────
  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (clean, lockfile-exact)
        working-directory: frontend
        run: npm ci

      # A permanently-red check is a check nobody reads, so this must stay
      # at zero rather than becoming a tolerated baseline.
      - name: Typecheck
        working-directory: frontend
        run: npm run check

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── The schema must come up from nothing ───────────────────────────────
  bootstrap:
    name: migration / bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The same bootstrap as the pytest job. Two ways to build an
      # environment is two environments, and the one that only appears in
      # CI is the one nobody debugs.
      - name: Install dependencies (fail-closed)
        run: python scripts/install_dependencies.py

      # A fresh install is the case least often exercised by hand and the
      # one a new deployment always hits. Running init_db twice also proves
      # the idempotent ALTER path, which is how every column added this
      # month reaches an existing database.
      - name: Initialise schema from empty, twice
        env:
          JARVIS_DISABLE_SCHEDULER: "1"
        run: |
          python -c "
          from app.database import init_db
          init_db(); print('first init ok')
          init_db(); print('second init ok — migrations are idempotent')
          "

  # ── Supply chain and secrets ───────────────────────────────────────────
  security:
    name: dependency + secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Advisory: a new upstream CVE should not block an unrelated commit,
    # but it must be visible rather than silent.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gitleaks needs history to scan diffs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Known vulnerabilities in dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc || true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
